name: Release
# Publishing a GitHub release publishes its tarball to npm. build.yml built the tarball for the tag after the check gate
# passed, signed it, and attached it to the draft release. This workflow downloads that file, verifies its signature,
# and publishes those exact bytes. It never builds the package. It uses npm trusted publishing (OpenID Connect), so the
# repository holds no npm token. npm adds a provenance attestation to the release.
# The publish job has id-token: write, so it runs only code that a lock records: the toolchain of mise.lock. It installs
# no package.
# The docs job deploys the API reference of the same release. It runs only after the publish job succeeds, so the site
# never describes a version that npm does not have.
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The cache is off. mise does not install again a tool that a restored cache holds.
      - name: Install toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7  # v5.2.0
        with:
          version: 2026.9.15
          cache: false
      # The tag is v and the version of package.json, and the tagged commit is on main. The tag comes from the
      # environment, not from an expression in the script.
      - name: Check the tag
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "The tag ${GITHUB_REF_NAME} is not v${version}, the version of package.json." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "The tagged commit is not on main." >&2
            exit 1
          fi
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" -D dist-package/ --pattern "*.tgz"
      # The release holds exactly one tarball. Its package.json names the package and the version of the tag. A
      # tarball that someone swapped or edited on the release fails here.
      - name: Verify the tarball matches the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          ls -l dist-package/
          files=(dist-package/*.tgz)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "The release must hold exactly one tarball." >&2
            exit 1
          fi
          expected="$(node -p 'require("./package.json").name')"
          packed="$(tar -xzOf "${files[0]}" package/package.json | node -e 'const p=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(p.name+"@"+p.version)')"
          if [ "${packed}" != "${expected}@${version}" ]; then
            echo "The tarball holds ${packed}, not ${expected}@${version}." >&2
            exit 1
          fi
      # Refuse a file that the attest job of build.yml did not sign for this tag. The signer workflow and the source
      # ref are fixed here, and the job does not read them from the release. The source digest is the commit that the
      # tag points to now, so a tag that moved after the build fails here.
      - name: Verify the build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)"
          if ! [[ "${digest}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve the tag ${TAG} to a commit." >&2
            exit 1
          fi
          gh attestation verify dist-package/*.tgz \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/build.yml" \
            --source-ref "refs/tags/${TAG}" \
            --source-digest "${digest}"
      # npm does not let a publisher replace a version. When npm has the version, the job stops with success.
      - name: Publish
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if [ -n "$(npm view "${name}@${version}" version 2>/dev/null)" ]; then
            echo "npm already has ${name}@${version}. Nothing to publish."
            exit 0
          fi
          # The path starts with ./, because npm reads dist-package/x.tgz as a GitHub repository shorthand.
          npm publish "./dist-package/${name}-${version}.tgz"
  # Calls docs.yml, which verifies and deploys the signed zip of the API reference. It needs publish, so a failed
  # publish gives no deploy.
  docs:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      tag: ${{ github.event.release.tag_name }}
