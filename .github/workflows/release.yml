name: Release
# Pushing a version tag, for example v0.1.0, creates a draft GitHub release. Publishing that release publishes the package
# to npm. It uses npm trusted publishing (OpenID Connect), so the repository holds no npm token. npm adds a provenance
# attestation to the release.
# The publish job has id-token: write, so it runs only code that a lock records: the toolchain of mise.lock and the
# packages of package-lock.json. It does not run the check gate, because the CI run of the commit on main already ran it.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
permissions:
  contents: read
jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # When a release for the tag exists, the job keeps it. The tag comes from the environment, not from an
      # expression in the script.
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "A release for ${GITHUB_REF_NAME} exists. Nothing to create."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The cache is off. mise does not install again a tool that a restored cache holds.
      - name: Install toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7  # v5.2.0
        with:
          version: 2026.9.15
          cache: false
      # The tag is v and the version of package.json, and the tagged commit is on main. The tag comes from the
      # environment, not from an expression in the script.
      - name: Check the tag
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "The tag ${GITHUB_REF_NAME} is not v${version}, the version of package.json." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "The tagged commit is not on main." >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: List the files of the package
        run: npm pack --dry-run
      # npm does not let a publisher replace a version. When npm has the version, the job stops with success.
      - name: Publish
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if [ -n "$(npm view "${name}@${version}" version 2>/dev/null)" ]; then
            echo "npm already has ${name}@${version}. Nothing to publish."
            exit 0
          fi
          npm publish
