name: CI
# Runs on each pull request update, on each push to main, and by hand. The check gate downloads the pinned spec
# artifact from cairn-proofs/oscal-bindings-specs and checks its sha256 before it uses any file from it.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
# A newer push to the same pull request cancels its superseded run. Runs for main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Node and the OpenSpec CLI from mise.toml, installed from mise.lock and its .mise/locks sidecar (the action
      # adds --locked when a lockfile is present). mise itself is pinned. The action is pinned by commit.
      - name: Install toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7  # v5.2.0
        with:
          version: 2026.9.15
      # Installs exactly what package-lock.json records, with integrity hashes. .npmrc disables install scripts.
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run check
