name: CI
# Runs on each pull request update, on each push to main, on each v* tag, and by hand. The check gate downloads the
# pinned spec artifact from cairn-proofs/oscal-bindings-specs and checks its sha256 before it uses any file from it.
# A v* tag also builds the package after the check gate passes, signs the package and the API reference, and attaches
# both to a draft GitHub release. Publishing that draft starts release.yml, which verifies the signature and publishes
# the tarball to npm, and docs.yml, which verifies the signature and deploys the API reference to GitHub Pages.
# Nothing downstream builds either file again. Outside tags, the consumer legs test the packed tarball on three lines
# of Node and TypeScript.
on:
  push:
    branches: ["main"]
    # Required: when `branches` is set, a tag push starts this workflow only if the tag is listed, and the draft
    # release would never be created.
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
# A newer push to the same pull request cancels its superseded run. Runs for main and for tags are never cancelled, so a
# release build cannot stop part way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Node and the OpenSpec CLI from mise.toml, installed from mise.lock and its .mise/locks sidecar (the action
      # adds --locked when a lockfile is present). mise itself is pinned. The action is pinned by commit.
      - name: Install toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7  # v5.2.0
        with:
          version: 2026.9.15
      # Installs exactly what package-lock.json records, with integrity hashes. .npmrc disables install scripts.
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run check
      # Builds the API reference with TypeDoc, from the separate package in api-docs/. A warning fails the build.
      - name: Docs
        run: npm run docs
      # The API reference that the gate built for this tag. The attest job signs it.
      - name: Upload the API reference
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: api-docs
          path: api-docs/site/
          if-no-files-found: error
  # Packs the tarball once for the consumer legs. It has no needs, so it runs in parallel with the check gate, and the
  # legs do not wait for the gate. It does not run on a tag: the package job packs the release tarball.
  consumer-package:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7  # v5.2.0
        with:
          version: 2026.9.15
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Pack
        run: |
          mkdir dist-package
          npm pack --pack-destination dist-package
          ls -l dist-package
      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: consumer-package
          path: dist-package/*.tgz
          if-no-files-found: error
  # Tests the packed tarball as a consumer installs it, on each supported line of Node and of TypeScript. Leg 1 uses
  # the floor of engines.node. A leg installs the tarball and the TypeScript of the leg in an empty project, with no
  # lockfile, so npm resolves the dependencies of the package as it does for a consumer. A leg reports the run on Node
  # and the type check as two steps. The check name comes from the lines only, so a patch version that moves does not
  # change the name that the ruleset "main: require PR and CI" requires. A change to the lines of a leg also changes
  # that ruleset. Each node-sha256 is the linux-x64 value from the SHASUMS256.txt of that Node version on nodejs.org.
  consumer:
    name: consumer (node ${{ matrix.node-line }}, ts ${{ matrix.ts-line }})
    needs: consumer-package
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-line: "22"
            ts-line: "5.9"
            node-version: 22.12.0
            node-sha256: e05a4d65232ae2b27b3d77da2e368522fb46b923335b8e0d5f77624c32484044
            ts-version: 5.9.3
          - node-line: "24"
            ts-line: "6.0"
            node-version: 24.22.3
            node-sha256: 061ec3e3062115705b56b51fa9cc330ab50d34b6969387d4e4b1a50c6809acc2
            ts-version: 6.0.3
          - node-line: "26"
            ts-line: "7.0"
            node-version: 26.13.0
            node-sha256: 5848553868b402d3fabb5b09270649977780a390f832155721025a08b5104455
            ts-version: 7.0.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: test/consumer
          persist-credentials: false
      # Caches the Node tarball, so most runs do not download it. The key holds the sha256, so a new pin gets a new entry.
      - name: Cache the Node tarball
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/node-download
          key: node-${{ matrix.node-version }}-${{ matrix.node-sha256 }}
      # The values come from the environment, not from expressions in the script. The sha256 check always runs. A cached
      # file that fails it is deleted and downloaded again. The job stops when the sha256 of the download differs from
      # the matrix value.
      - name: Install Node
        env:
          NODE_VERSION: ${{ matrix.node-version }}
          NODE_SHA256: ${{ matrix.node-sha256 }}
        run: |
          file="${RUNNER_TEMP}/node-download/node-v${NODE_VERSION}-linux-x64.tar.gz"
          if [ -f "${file}" ] && ! echo "${NODE_SHA256}  ${file}" | sha256sum --check --status -; then
            echo "The cached file fails the sha256 check. Downloading it again."
            rm -f "${file}"
          fi
          if [ ! -f "${file}" ]; then
            mkdir -p "${RUNNER_TEMP}/node-download"
            curl --fail --silent --show-error --location --retry 3 --output "${file}" "https://nodejs.org/dist/v${NODE_VERSION}/${file##*/}"
          fi
          echo "${NODE_SHA256}  ${file}" | sha256sum --check -
          mkdir "${RUNNER_TEMP}/node"
          tar --extract --gzip --strip-components=1 --directory "${RUNNER_TEMP}/node" --file "${file}"
          echo "${RUNNER_TEMP}/node/bin" >> "${GITHUB_PATH}"
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: consumer-package
          path: ${{ runner.temp }}/package
      - name: Install the package and TypeScript in an empty project
        id: install
        env:
          TS_VERSION: ${{ matrix.ts-version }}
        run: |
          node --version
          cp -r test/consumer "${RUNNER_TEMP}/consumer"
          cd "${RUNNER_TEMP}/consumer"
          echo '{"name":"consumer","private":true,"type":"module"}' > package.json
          npm install --ignore-scripts --no-audit --no-fund "${RUNNER_TEMP}"/package/*.tgz "typescript@${TS_VERSION}"
      - name: Run on Node
        run: |
          cd "${RUNNER_TEMP}/consumer"
          node check.mjs
      # Runs when the install succeeds, also when the run on Node fails, so each leg reports both results.
      - name: Type-check with TypeScript
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          cd "${RUNNER_TEMP}/consumer"
          ./node_modules/.bin/tsc --version
          ./node_modules/.bin/tsc -p tsconfig.json
  # The release tag preflight. It runs in parallel with the check gate and fails fast. A release comes only from main,
  # and the tag is v and the version of package.json.
  tag-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The tag comes from the environment, not from an expression in the script.
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${TAG}" != "v${version}" ]; then
            echo "The tag ${TAG} is not v${version}, the version of package.json." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "The tag ${TAG} points at ${GITHUB_SHA}, which is not on main." >&2
            exit 1
          fi
      # README.md states that the binding passes the conformance corpus, so a release has no expected failure.
      - name: Check the expected failures
        run: |
          listed="$(node -p 'Object.keys(require("./test/conformance/expected-failures.json")).join("\n")')"
          if [ -n "${listed}" ]; then
            echo "test/conformance/expected-failures.json lists cases that the binding does not pass:" >&2
            echo "${listed}" >&2
            exit 1
          fi
  # Builds the package that npm receives. It runs only after the check gate passes for the tagged commit, so npm gets
  # a file from a commit that passed the gate.
  package:
    needs: [build, tag-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7  # v5.2.0
        with:
          version: 2026.9.15
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # The tarball name is the package name and the version.
      - name: Pack
        run: |
          mkdir dist-package
          npm pack --pack-destination dist-package
          ls -l dist-package
      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: npm-package
          path: dist-package/*.tgz
          if-no-files-found: error
  # Signs the build provenance of the tarball and of the zip of the API reference. Each signature binds the digest of the
  # file to this workflow, the commit and the tag. release.yml verifies the tarball and docs.yml verifies the zip
  # before they use it, so each refuses a file that this job did not sign. Only this job holds id-token and
  # attestations write.
  attest:
    needs: [build, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: npm-package
          path: release-assets/
      - name: Download the API reference
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: api-docs
          path: api-docs/
      # index.html is at the root of the zip, because zip runs inside the folder of the site.
      - name: Zip the API reference
        run: (cd api-docs && zip -r -q ../release-assets/api-docs.zip .)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            release-assets/*.tgz
            release-assets/api-docs.zip
      - name: Upload the signed files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
  # Creates the draft release with the signed tarball and the signed zip of the API reference attached. A draft never
  # exists without an attestation, because this job needs attest. A maintainer reviews the draft and publishes it, which starts release.yml.
  draft-release:
    needs: attest
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the signed files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-assets
          path: release-assets/
      # The tag comes from the environment, not from an expression in the script. When a release for the tag exists,
      # the job keeps it. --verify-tag refuses to create the release when the tag is missing.
      - name: Create the draft release with the signed files attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "A release for ${TAG} exists. Nothing to create."
            exit 0
          fi
          gh release create "${TAG}" release-assets/* --draft --verify-tag --generate-notes --title "${TAG}"
