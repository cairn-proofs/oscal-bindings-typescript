name: CI
# Runs on each pull request update, on each push to main, on each v* tag, and by hand. The check gate downloads the
# pinned spec artifact from cairn-proofs/oscal-bindings-specs and checks its sha256 before it uses any file from it.
# A v* tag also builds the package after the check gate passes, signs it, and attaches it to a draft GitHub release.
# Publishing that draft starts release.yml, which verifies the signature and publishes those exact files to npm.
# Nothing downstream builds the package again.
on:
  push:
    branches: ["main"]
    # Required: when `branches` is set, a tag push starts this workflow only if the tag is listed, and the draft
    # release would never be created.
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
# A newer push to the same pull request cancels its superseded run. Runs for main and for tags are never cancelled, so a
# release build cannot stop part way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Node and the OpenSpec CLI from mise.toml, installed from mise.lock and its .mise/locks sidecar (the action
      # adds --locked when a lockfile is present). mise itself is pinned. The action is pinned by commit.
      - name: Install toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7  # v5.2.0
        with:
          version: 2026.9.15
      # Installs exactly what package-lock.json records, with integrity hashes. .npmrc disables install scripts.
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run check
      # Builds the API reference with TypeDoc, from the separate package in api-docs/. A warning fails the build.
      - name: Docs
        run: npm run docs
  # The release tag preflight. It runs in parallel with the check gate and fails fast. A release comes only from main,
  # and the tag is v and the version of package.json.
  tag-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The tag comes from the environment, not from an expression in the script.
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${TAG}" != "v${version}" ]; then
            echo "The tag ${TAG} is not v${version}, the version of package.json." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "The tag ${TAG} points at ${GITHUB_SHA}, which is not on main." >&2
            exit 1
          fi
  # Builds the package that npm receives. It runs only after the check gate passes for the tagged commit, so npm gets
  # a file from a commit that passed the gate.
  package:
    needs: [build, tag-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7  # v5.2.0
        with:
          version: 2026.9.15
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # The tarball name is the package name and the version.
      - name: Pack
        run: |
          mkdir dist-package
          npm pack --pack-destination dist-package
          ls -l dist-package
      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: npm-package
          path: dist-package/*.tgz
          if-no-files-found: error
  # Signs the build provenance of the tarball. The signature binds the digest of the file to this workflow, the commit
  # and the tag. release.yml verifies it before the publish, so it refuses a file that this job did not sign. Only this
  # job holds id-token and attestations write.
  attest:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: npm-package
          path: dist-package/
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist-package/*.tgz
  # Creates the draft release with the signed tarball attached. A draft never exists without an attestation, because
  # this job needs attest. A maintainer reviews the draft and publishes it, which starts release.yml.
  draft-release:
    needs: [package, attest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: npm-package
          path: dist-package/
      # The tag comes from the environment, not from an expression in the script. When a release for the tag exists,
      # the job keeps it. --verify-tag refuses to create the release when the tag is missing.
      - name: Create the draft release with the package attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "A release for ${TAG} exists. Nothing to create."
            exit 0
          fi
          gh release create "${TAG}" dist-package/*.tgz --draft --verify-tag --generate-notes --title "${TAG}"
