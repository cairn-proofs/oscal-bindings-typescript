name: Docs
# Deploys the API reference of a release tag to GitHub Pages. build.yml built the site after the check gate passed,
# signed the zip of the site, and attached the zip to the draft release. This workflow downloads that file, verifies its
# signature, and deploys those exact files. It never builds the site.
# release.yml calls this workflow after the publish to npm succeeds, so a failed publish gives no deploy. A maintainer
# can also run the workflow by hand, to deploy again or to repeat a failed deploy. Start the manual run from the tag,
# for example `gh workflow run docs.yml --ref v<version> -f tag=v<version>`. The first step fails the run unless the
# run ref is the tag v* that the input names. The environment github-pages must allow only the tags v*.
# The package job checks out nothing, installs nothing and has contents: read only. The deploy job has pages: write and
# id-token: write and runs only deploy-pages, so it runs no code from the repository.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to deploy, for example v0.2.3"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy, for example v0.2.3"
        required: true
        type: string
permissions:
  contents: read
jobs:
  # Verifies the signed zip and uploads it as the Pages artifact. It has no Pages or OIDC permission. It is a separate
  # job from the deploy job, because deploy-pages looks up the artifact right after the upload, and in one job that
  # lookup can come back empty for an artifact that was finalized a moment earlier (actions/deploy-pages#451).
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The run is on a tag v*, and the tag that the job deploys is the tag of the run. The values come from the
      # environment, not from an expression in the script.
      - name: Check the run ref
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [[ "${GITHUB_REF_NAME}" != v* ]] || [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "The run ref ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME} is not the tag ${TAG}, or the tag does not start with v." >&2
            exit 1
          fi
      - name: Download the API reference
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" -D dist/ --pattern "api-docs.zip"
      # Refuse a file that the attest job of build.yml did not sign for this tag. The signer workflow and the source ref
      # are fixed here, and the job does not read them from the release. The source digest is the commit that the tag
      # points to now, so a tag that moved after the build fails here.
      - name: Verify the build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)"
          if ! [[ "${digest}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve the tag ${TAG} to a commit." >&2
            exit 1
          fi
          gh attestation verify dist/api-docs.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/build.yml" \
            --source-ref "refs/tags/${TAG}" \
            --source-digest "${digest}"
      - name: Unzip the API reference
        run: |
          unzip -q dist/api-docs.zip -d site/
          test -f site/index.html
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/
  # Deploys the Pages artifact of the package job. It has pages: write and id-token: write and one step, so it runs no
  # code from the repository and none from the release.
  deploy:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
