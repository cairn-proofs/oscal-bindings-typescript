name: Docs
# Publishing a release deploys the API reference of its tag to GitHub Pages. build.yml built the site after the check
# gate passed, signed the zip of the site, and attached the zip to the draft release. This workflow downloads that
# file, verifies its signature, and deploys those exact files. It never builds the site.
# A maintainer can run the workflow by hand, for the first deploy or to repeat a failed one. Start the manual run from
# the tag, for example `gh workflow run docs.yml --ref v<version> -f tag=v<version>`. The first step fails the run
# unless the run ref is the tag v* that the release or the input names. The environment github-pages must allow only
# the tags v*.
# The job has pages: write and id-token: write, so it runs no code from the repository. It checks out nothing and
# installs nothing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy, for example v0.2.1"
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # The run is on a tag v*, and the tag that the job deploys is the tag of the run. The values come from the
      # environment, not from an expression in the script.
      - name: Check the run ref
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [[ "${GITHUB_REF_NAME}" != v* ]] || [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "The run ref ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME} is not the tag ${TAG}, or the tag does not start with v." >&2
            exit 1
          fi
      - name: Download the API reference
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" -D dist/ --pattern "api-docs.zip"
      # Refuse a file that the attest job of build.yml did not sign for this tag. The signer workflow and the source ref
      # are fixed here, and the job does not read them from the release. The source digest is the commit that the tag
      # points to now, so a tag that moved after the build fails here.
      - name: Verify the build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)"
          if ! [[ "${digest}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve the tag ${TAG} to a commit." >&2
            exit 1
          fi
          gh attestation verify dist/api-docs.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/build.yml" \
            --source-ref "refs/tags/${TAG}" \
            --source-digest "${digest}"
      - name: Unzip the API reference
        run: |
          unzip -q dist/api-docs.zip -d site/
          test -f site/index.html
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
